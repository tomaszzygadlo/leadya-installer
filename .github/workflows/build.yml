name: Private Windows unit RED GREEN
run-name: Authenticated private unit evidence
on:
  workflow_dispatch:
    inputs:
      input_ref:
        description: Immutable public ciphertext commit
        required: true
        type: string
      red_tree:
        description: Normal staged RED Git tree
        required: true
        type: string
      green_tree:
        description: Prospective GREEN Git tree
        required: true
        type: string
      source_zip_sha256:
        description: Authenticated source ZIP SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-windows-unit
  cancel-in-progress: false
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      LEADYA_SOURCE_COMMIT: '709c62ba7c1dc27588b1608ef1fc3fed5ec2c232'
      LEADYA_SOURCE_TREE: '55e52f37023f971a89ae32fb876a369fe379da15'
      LEADYA_ARCHIVE_SHA256: '1e7b512be3f640563cd3a08854793dfa01da3f5213ad13cef6bc6c665e51d0c9'
      DEVUNIT_RED_TREE: ${{ inputs.red_tree }}
      DEVUNIT_GREEN_TREE: ${{ inputs.green_tree }}
      DEVUNIT_ZIP_SHA256: ${{ inputs.source_zip_sha256 }}
      DEVUNIT_INPUT_REF: ${{ inputs.input_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate immutable identities and initialize private paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64'){throw 'Expected Windows X64'}
          foreach($name in @('DEVUNIT_RED_TREE','DEVUNIT_GREEN_TREE','DEVUNIT_INPUT_REF')){if([Environment]::GetEnvironmentVariable($name) -cnotmatch '^[0-9a-f]{40}$'){throw 'Invalid tree or input identity'}}
          if($env:DEVUNIT_ZIP_SHA256 -cnotmatch '^[0-9a-f]{64}$'){throw 'Invalid source digest'}
          $paths=@{DEVUNIT_RESULT_ROOT="$env:RUNNER_TEMP/unit-private-result";DEVUNIT_SOURCE_ROOT="$env:RUNNER_TEMP/unit-private-input/source";DEVUNIT_BOOTSTRAP_ROOT="$env:RUNNER_TEMP/unit-gate-bootstrap/source"}
          foreach($name in $paths.Keys){"$name=$($paths[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8}
          New-Item -ItemType Directory -Path $paths.DEVUNIT_RESULT_ROOT | Out-Null
          @{status='PREPARATION_PENDING';runtime_tests='NOT_RUN'} | ConvertTo-Json | Set-Content "$($paths.DEVUNIT_RESULT_ROOT)/unit-status.json"
          @{workflow_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;red_tree=$env:DEVUNIT_RED_TREE;prospective_green_tree=$env:DEVUNIT_GREEN_TREE;source_zip_sha256=$env:DEVUNIT_ZIP_SHA256;runner_os=$env:RUNNER_OS;runner_arch=$env:RUNNER_ARCH} | ConvertTo-Json | Set-Content "$($paths.DEVUNIT_RESULT_ROOT)/identity.json"
      - name: Materialize original small canonical admission checkout
        shell: pwsh
        env:
          LEADYA_SOURCE_000: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P000 }}
          LEADYA_SOURCE_001: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P001 }}
          LEADYA_SOURCE_002: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P002 }}
          LEADYA_SOURCE_003: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P003 }}
          LEADYA_SOURCE_004: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P004 }}
          LEADYA_SOURCE_005: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P005 }}
