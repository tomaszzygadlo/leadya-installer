          LEADYA_SOURCE_076: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P076 }}
          LEADYA_SOURCE_077: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P077 }}
          LEADYA_SOURCE_078: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P078 }}
          LEADYA_SOURCE_079: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P079 }}
          LEADYA_SOURCE_080: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P080 }}
          LEADYA_SOURCE_081: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P081 }}
          LEADYA_SOURCE_082: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P082 }}
          LEADYA_SOURCE_083: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P083 }}
          LEADYA_SOURCE_084: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P084 }}
          LEADYA_SOURCE_085: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P085 }}
          LEADYA_SOURCE_086: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P086 }}
          LEADYA_SOURCE_087: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P087 }}
          LEADYA_SOURCE_088: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_P088 }}
        run: |
          $ErrorActionPreference='Stop'
          python release_source_ci.py materialize --parts 89 --archive-sha256 $env:LEADYA_ARCHIVE_SHA256 --commit $env:LEADYA_SOURCE_COMMIT --tree $env:LEADYA_SOURCE_TREE --destination "$env:RUNNER_TEMP/leadya-private-input"
          if($LASTEXITCODE -ne 0){throw 'Private source validation failed'}
          Copy-Item "$env:RUNNER_TEMP/leadya-private-input/input-provenance.json" "$env:LEADYA_RESULT_ROOT/input-provenance.json"
      - name: Acquire and check real runner heavy admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          @('LEADYA_MAIN_BRANCH=hotfix/0.12.3','LEADYA_WORK_ENVIRONMENT=hotfix','LEADYA_DEV_BRANCH=dev/0.12.1') | Set-Content "$env:LEADYA_SOURCE_ROOT/.env" -Encoding utf8
          $gate="$env:LEADYA_SOURCE_ROOT/.agents/skills/leadya-project-manager/scripts/host_gate.py"
          $receipt="$env:RUNNER_TEMP/leadya-ci-admission-private.json"
          python $gate acquire --heavy --key release-B7A46C8D209E --checkout $env:LEADYA_SOURCE_ROOT --memory-gib 1 --disk-gib 1 --receipt-out $receipt *> "$env:RUNNER_TEMP/admission-output-private.txt"
          if($LASTEXITCODE -ne 0){throw 'Canonical heavy admission refused'}
          $a=(Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json).admission
          python $gate check --key $a.key --token $a.token --checkout $env:LEADYA_SOURCE_ROOT --heavy --memory-gib 1 --disk-gib 1 > "$env:LEADYA_RESULT_ROOT/admission-check.json"
          if($LASTEXITCODE -ne 0){throw 'Canonical heavy check refused'}
      - name: Run authenticated real Chromium smoke without external actions
        shell: pwsh
        env:
          LEADYA_BROWSER_AUTH: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_BROWSER_AUTH }}
        run: |
          $ErrorActionPreference='Stop'
          python postdeploy-browser-smoke-source-check.py *> "$env:LEADYA_RESULT_ROOT/unit-tests.log"
          if($LASTEXITCODE -ne 0){throw 'Source boundary checks failed'}
          python -m unittest -v test_browser_result_transport *>> "$env:LEADYA_RESULT_ROOT/unit-tests.log"
          if($LASTEXITCODE -ne 0){throw 'Evidence transport checks failed'}
          python -m pip install --disable-pip-version-check --quiet selenium==4.20.0 *> "$env:RUNNER_TEMP/browser-dependencies-private.txt"
          if($LASTEXITCODE -ne 0){throw 'Browser dependency preparation failed'}
          $driver=Join-Path $env:CHROMEWEBDRIVER 'chromedriver.exe'
          $browser='C:/Program Files/Google/Chrome/Application/chrome.exe'
          if(-not(Test-Path -LiteralPath $driver) -or -not(Test-Path -LiteralPath $browser)){throw 'Image browser/driver unavailable'}
          $auth=Join-Path $env:RUNNER_TEMP 'leadya-browser-auth-private.json'
          [IO.File]::WriteAllBytes($auth,[Convert]::FromBase64String($env:LEADYA_BROWSER_AUTH))
          Remove-Item Env:LEADYA_BROWSER_AUTH
          $privateOutput=Join-Path $env:RUNNER_TEMP 'leadya-browser-session-output'
          python postdeploy-browser-smoke.py --input $auth --output $privateOutput --browser chrome --binary $browser --driver $driver *> "$env:RUNNER_TEMP/browser-output-private.txt"
          $smokeExit=$LASTEXITCODE
          python browser_result_transport.py --directory $privateOutput --output "$env:LEADYA_RESULT_ROOT/build.log"
          if($LASTEXITCODE -ne 0){throw 'Browser evidence packaging failed'}
          $status=if($smokeExit -eq 0){'BROWSER_SMOKE_PASS'}else{'BROWSER_SMOKE_FAIL'}
          @{status=$status;purpose='post-deploy browser verification';publication_ready=$false} | ConvertTo-Json | Set-Content "$env:LEADYA_RESULT_ROOT/build-status.json"
          if($smokeExit -ne 0){throw 'Authenticated browser smoke failed'}
      - name: Release only this runner admission
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          $receipt="$env:RUNNER_TEMP/leadya-ci-admission-private.json"
          if(Test-Path -LiteralPath $receipt){
            python "$env:LEADYA_SOURCE_ROOT/.agents/skills/leadya-project-manager/scripts/host_gate.py" release --receipt-file $receipt > "$env:LEADYA_RESULT_ROOT/release.json"
            if($LASTEXITCODE -ne 0){throw 'Own admission release failed'}
          }
      - name: Encrypt result before any artifact upload
        if: always()
        shell: pwsh
        env:
          LEADYA_RESULT_KEY: ${{ secrets.LEADYA_RELEASE_B7A46C8D209E_RESULT_KEY }}
        run: |
          ./seal_release_result.ps1 -ResultDirectory $env:LEADYA_RESULT_ROOT -OutputDirectory "$env:RUNNER_TEMP/leadya-private-sealed"
      - name: Preserve only encrypted result and authenticated envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: leadya-private-build-B7A46C8D209E
          path: |
            ${{ runner.temp }}/leadya-private-sealed/result.cipher
            ${{ runner.temp }}/leadya-private-sealed/result-envelope.json
          if-no-files-found: error
          retention-days: 7
