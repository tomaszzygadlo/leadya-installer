          LEADYA_SOURCE_073: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P073 }}
          LEADYA_SOURCE_074: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P074 }}
          LEADYA_SOURCE_075: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P075 }}
          LEADYA_SOURCE_076: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P076 }}
          LEADYA_SOURCE_077: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P077 }}
          LEADYA_SOURCE_078: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P078 }}
          LEADYA_SOURCE_079: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P079 }}
          LEADYA_SOURCE_080: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P080 }}
          LEADYA_SOURCE_081: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P081 }}
          LEADYA_SOURCE_082: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P082 }}
          LEADYA_SOURCE_083: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P083 }}
          LEADYA_SOURCE_084: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P084 }}
          LEADYA_SOURCE_085: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P085 }}
          LEADYA_SOURCE_086: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P086 }}
          LEADYA_SOURCE_087: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P087 }}
          LEADYA_SOURCE_088: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_P088 }}
        run: |
          $ErrorActionPreference='Stop'
          python release_source_ci.py materialize --parts 89 --archive-sha256 $env:LEADYA_ARCHIVE_SHA256 --commit $env:LEADYA_SOURCE_COMMIT --tree $env:LEADYA_SOURCE_TREE --destination "$env:RUNNER_TEMP/leadya-private-input"
          if($LASTEXITCODE -ne 0){throw 'Private source validation failed'}
          Copy-Item "$env:RUNNER_TEMP/leadya-private-input/input-provenance.json" "$env:LEADYA_RESULT_ROOT/input-provenance.json"
      - name: Acquire and check real runner heavy admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          @('LEADYA_MAIN_BRANCH=hotfix/0.12.3','LEADYA_WORK_ENVIRONMENT=hotfix','LEADYA_DEV_BRANCH=dev/0.12.1') | Set-Content "$env:LEADYA_SOURCE_ROOT/.env" -Encoding utf8
          $gate="$env:LEADYA_SOURCE_ROOT/.agents/skills/leadya-project-manager/scripts/host_gate.py"
          $receipt="$env:RUNNER_TEMP/leadya-ci-admission-private.json"
          python $gate acquire --heavy --key release-74CA3BE54D74 --checkout $env:LEADYA_SOURCE_ROOT --memory-gib 1 --disk-gib 1 --receipt-out $receipt *> "$env:RUNNER_TEMP/admission-output-private.txt"
          if($LASTEXITCODE -ne 0){throw 'Canonical heavy admission refused'}
          $a=(Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json).admission
          python $gate check --key $a.key --token $a.token --checkout $env:LEADYA_SOURCE_ROOT --heavy --memory-gib 1 --disk-gib 1 > "$env:LEADYA_RESULT_ROOT/admission-check.json"
          if($LASTEXITCODE -ne 0){throw 'Canonical heavy check refused'}
      - name: Verify transport and unchanged public bootstrap boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest -v test_release_source_ci *> "$env:LEADYA_RESULT_ROOT/unit-tests.log"
          if($LASTEXITCODE -ne 0){throw 'Transport tests failed'}
          Push-Location foundation
          try {
            python -m unittest -v test_ci_bootstrap test_assessment_workflow *>> "$env:LEADYA_RESULT_ROOT/unit-tests.log"
            if($LASTEXITCODE -ne 0){throw 'Pinned bootstrap boundary tests failed'}
          } finally {Pop-Location}
          python "$env:LEADYA_SOURCE_ROOT/ExternalInstaller/opensource/build.py" --source-directory "$env:LEADYA_SOURCE_ROOT/ExternalInstaller" --verify-snapshot "$env:LEADYA_SOURCE_ROOT/ExternalInstaller/opensource/source-lock.json" *> "$env:LEADYA_RESULT_ROOT/source-verification.log"
          if($LASTEXITCODE -ne 0){throw 'Private/public source snapshot differs'}
      - name: Prepare pinned official NSIS compiler and plugins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python foundation/ci_bootstrap.py --output "$env:RUNNER_TEMP/leadya-nsis" --seven-zip 'C:/Program Files/7-Zip/7z.exe' *> "$env:LEADYA_RESULT_ROOT/bootstrap.log"
          if($LASTEXITCODE -ne 0){throw 'Pinned toolchain bootstrap failed'}
          Copy-Item "$env:RUNNER_TEMP/leadya-nsis/ci-sdk.json" "$env:LEADYA_RESULT_ROOT/ci-sdk.json"
      - name: Build final private release installer variants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk=Get-Content "$env:RUNNER_TEMP/leadya-nsis/ci-sdk.json" -Raw | ConvertFrom-Json
          $env:PATH=(Split-Path -Parent $sdk.compiler)+';'+$env:PATH
          $env:PY_PYTHON3='3.12'
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          Push-Location "$env:LEADYA_SOURCE_ROOT/ExternalInstaller"
          try {
            & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File ./BuildInstallers.ps1 *> "$env:LEADYA_RESULT_ROOT/build.log"
            if($LASTEXITCODE -ne 0){throw 'Final NSIS producer failed'}
          } finally {Pop-Location}
          python release_source_ci.py collect --source $env:LEADYA_SOURCE_ROOT --result $env:LEADYA_RESULT_ROOT --commit $env:LEADYA_SOURCE_COMMIT
          if($LASTEXITCODE -ne 0){throw 'Final asset provenance verification failed'}
          $signatures=@(Get-ChildItem "$env:LEADYA_RESULT_ROOT/installers/*.exe" | ForEach-Object {
            $signature=Get-AuthenticodeSignature -LiteralPath $_.FullName
            if($signature.Status.ToString() -ne 'NotSigned'){throw 'Unexpected signing identity/status'}
            @{filename=$_.Name;status=$signature.Status.ToString();sha256=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()}
          })
          $signatures | ConvertTo-Json | Set-Content "$env:LEADYA_RESULT_ROOT/authenticode.json"
          @{status='BUILT_UNSIGNED_AV_PENDING';publication_ready=$false;source_commit=$env:LEADYA_SOURCE_COMMIT} | ConvertTo-Json | Set-Content "$env:LEADYA_RESULT_ROOT/build-status.json"
      - name: Release only this runner admission
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          $receipt="$env:RUNNER_TEMP/leadya-ci-admission-private.json"
          if(Test-Path -LiteralPath $receipt){
            python "$env:LEADYA_SOURCE_ROOT/.agents/skills/leadya-project-manager/scripts/host_gate.py" release --receipt-file $receipt > "$env:LEADYA_RESULT_ROOT/release.json"
            if($LASTEXITCODE -ne 0){throw 'Own admission release failed'}
          }
      - name: Encrypt result before any artifact upload
        if: always()
        shell: pwsh
        env:
          LEADYA_RESULT_KEY: ${{ secrets.LEADYA_RELEASE_74CA3BE54D74_RESULT_KEY }}
        run: |
          ./seal_release_result.ps1 -ResultDirectory $env:LEADYA_RESULT_ROOT -OutputDirectory "$env:RUNNER_TEMP/leadya-private-sealed"
      - name: Preserve only encrypted result and authenticated envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: leadya-private-build-74CA3BE54D74
          path: |
            ${{ runner.temp }}/leadya-private-sealed/result.cipher
            ${{ runner.temp }}/leadya-private-sealed/result-envelope.json
          if-no-files-found: error
          retention-days: 7
