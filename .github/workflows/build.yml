          $env:LEADYA_RESULT_ROOT="$env:RUNNER_TEMP/leadya-private-result"
          $env:LEADYA_SOURCE_ROOT="$env:RUNNER_TEMP/leadya-private-input/source"
          "LEADYA_RESULT_ROOT=$env:LEADYA_RESULT_ROOT" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LEADYA_SOURCE_ROOT=$env:LEADYA_SOURCE_ROOT" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path $env:LEADYA_RESULT_ROOT | Out-Null
          @{workflow_commit=$env:GITHUB_SHA;run_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";source_commit=$env:LEADYA_SOURCE_COMMIT;runner_os=$env:RUNNER_OS;runner_arch=$env:RUNNER_ARCH} | ConvertTo-Json | Set-Content "$env:LEADYA_RESULT_ROOT/identity.json"
          @{status='PREPARATION_PENDING';publication_ready=$false} | ConvertTo-Json | Set-Content "$env:LEADYA_RESULT_ROOT/build-status.json"
      - name: Materialize frozen offline Git source
