name: Unsigned Windows installer build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This image keeps Defender enabled; the Server image disables it for performance.
    # Assessment still refuses any remaining exceptions or unsupported scanner policy.
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check dependency download boundaries
        run: python -m unittest -v test_ci_bootstrap
      - name: Prepare pinned official compiler and plugins
        run: python ci_bootstrap.py --output "$env:RUNNER_TEMP\leadya-nsis" --seven-zip "C:\Program Files\7-Zip\7z.exe"
      - name: Build and test through Maven
        shell: pwsh
        run: |
          $sdk = Get-Content "$env:RUNNER_TEMP\leadya-nsis\ci-sdk.json" -Raw | ConvertFrom-Json
          mvn -B --no-transfer-progress clean verify "-Dinstaller.python=python" "-Dinstaller.compiler=$($sdk.compiler)" "-Dinstaller.plugins=$($sdk.plugins)"
      - name: Record unsigned artifact provenance
        shell: pwsh
        run: |
          $file = Get-Item target/LeadyaInstaller.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          $build = Get-Content target/LeadyaInstaller.build.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($signature.Status.ToString() -ne 'NotSigned' -or $build.publication_ready -ne $false -or $build.artifact_sha256 -ne $hash) {
            throw 'Unexpected signature or build-manifest mismatch'
          }
          @{
            source_commit = $env:GITHUB_SHA
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            artifact_sha256 = $hash
            artifact_bytes = $file.Length
            authenticode_status = $signature.Status.ToString()
            publication_ready = $false
            signpath_configured = $false
          } | ConvertTo-Json | Set-Content target/ci-provenance.json -Encoding utf8
          "$hash  LeadyaInstaller.exe" | Set-Content target/SHA256SUMS.txt -Encoding ascii
          Copy-Item "$env:RUNNER_TEMP\leadya-nsis\ci-sdk.json" target/ci-sdk.json
          'Unsigned assessment build. SignPath enrollment and release signing are not configured.' >> $env:GITHUB_STEP_SUMMARY
          '[Code signing policy](https://github.com/tomaszzygadlo/leadya-installer/blob/main/CODE_SIGNING_POLICY.md)' >> $env:GITHUB_STEP_SUMMARY
      - name: Assess final installer bytes with Microsoft Defender
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $PSHOME 'Modules'
          . .\InstallerReleaseSecurity.ps1
          try {
            $evidence = Get-InstallerReleaseSecurityEvidence -Path target/LeadyaInstaller.exe -AssessmentOnly
            $build = Get-Content target/LeadyaInstaller.build.json -Raw | ConvertFrom-Json
            if ($evidence.publication_ready -ne $false -or $evidence.artifact_sha256 -ne $build.artifact_sha256) {
              throw 'Assessment artifact identity or publication policy mismatch'
            }
            $evidence | ConvertTo-Json -Depth 8 | Set-Content target/defender-assessment.json -Encoding utf8
            'Defender assessment completed for the recorded SHA256; package remains unsigned, publication_ready=false.' >> $env:GITHUB_STEP_SUMMARY
          } catch {
            @{ status = 'NOT_PASSED'; reason = $_.Exception.Message; publication_ready = $false } |
              ConvertTo-Json | Set-Content target/defender-assessment.json -Encoding utf8
            'Defender assessment NOT_PASSED. No protection settings were changed and no AV clearance is asserted.' >> $env:GITHUB_STEP_SUMMARY
            throw
          }
      - name: Preserve assessment evidence after success or refusal
        if: ${{ always() && hashFiles('target/defender-assessment.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leadya-installer-assessment-${{ github.sha }}
          path: |
            target/defender-assessment.json
            target/ci-provenance.json
            target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: leadya-installer-unsigned-${{ github.sha }}
          path: target/*
          if-no-files-found: error
          retention-days: 14
