name: Private Windows unit RED GREEN
run-name: Authenticated private unit evidence
on:
  workflow_dispatch:
    inputs:
      input_ref:
        description: Immutable public ciphertext commit
        required: true
        type: string
      red_tree:
        description: Normal staged RED Git tree
        required: true
        type: string
      green_tree:
        description: Prospective GREEN Git tree
        required: true
        type: string
      source_zip_sha256:
        description: Authenticated source ZIP SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: group-validation-v2-6a31c8e249d0
  cancel-in-progress: false
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      LEADYA_SOURCE_COMMIT: '709c62ba7c1dc27588b1608ef1fc3fed5ec2c232'
      LEADYA_SOURCE_TREE: '55e52f37023f971a89ae32fb876a369fe379da15'
      LEADYA_ARCHIVE_SHA256: '1e7b512be3f640563cd3a08854793dfa01da3f5213ad13cef6bc6c665e51d0c9'
      DEVUNIT_RED_TREE: ${{ inputs.red_tree }}
      DEVUNIT_GREEN_TREE: ${{ inputs.green_tree }}
      DEVUNIT_ZIP_SHA256: ${{ inputs.source_zip_sha256 }}
      DEVUNIT_INPUT_REF: ${{ inputs.input_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate immutable identities and initialize private paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64'){throw 'Expected Windows X64'}
          foreach($name in @('DEVUNIT_RED_TREE','DEVUNIT_GREEN_TREE','DEVUNIT_INPUT_REF')){if([Environment]::GetEnvironmentVariable($name) -cnotmatch '^[0-9a-f]{40}$'){throw 'Invalid tree or input identity'}}
          if($env:DEVUNIT_ZIP_SHA256 -cnotmatch '^[0-9a-f]{64}$'){throw 'Invalid source digest'}
          $paths=@{DEVUNIT_RESULT_ROOT="$env:RUNNER_TEMP/unit-private-result";DEVUNIT_SOURCE_ROOT="$env:RUNNER_TEMP/unit-private-input/source";DEVUNIT_BOOTSTRAP_ROOT="$env:RUNNER_TEMP/unit-gate-bootstrap/source"}
          foreach($name in $paths.Keys){"$name=$($paths[$name])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8}
          New-Item -ItemType Directory -Path $paths.DEVUNIT_RESULT_ROOT | Out-Null
          @{status='PREPARATION_PENDING';runtime_tests='NOT_RUN'} | ConvertTo-Json | Set-Content "$($paths.DEVUNIT_RESULT_ROOT)/unit-status.json"
          @{workflow_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;red_tree=$env:DEVUNIT_RED_TREE;prospective_green_tree=$env:DEVUNIT_GREEN_TREE;source_zip_sha256=$env:DEVUNIT_ZIP_SHA256;runner_os=$env:RUNNER_OS;runner_arch=$env:RUNNER_ARCH} | ConvertTo-Json | Set-Content "$($paths.DEVUNIT_RESULT_ROOT)/identity.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ inputs.input_ref }}'
          path: encrypted-input
          persist-credentials: false
          sparse-checkout: |
            source.cipher
            source-envelope.json
            bootstrap.cipher
            bootstrap-envelope.json
          sparse-checkout-cone-mode: false
      - name: Materialize original small canonical admission checkout
        shell: pwsh
        env:
          DEVUNIT_BOOTSTRAP_KEY: ${{ secrets.LEADYA_GROUP_V2_6A31C8E249D0_BOOTSTRAP_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          ./private_unit_crypto.ps1 -Action bootstrap -InputDirectory ./encrypted-input -OutputPath "$env:RUNNER_TEMP/unit-bootstrap-private.tar.xz" -RedTree $env:DEVUNIT_RED_TREE -GreenTree $env:DEVUNIT_GREEN_TREE -ZipSha256 $env:DEVUNIT_ZIP_SHA256
          ./Invoke-PrivateUnitPython.ps1 -Script ./release_source_ci.py -ScriptArguments @('materialize','--archive',"$env:RUNNER_TEMP/unit-bootstrap-private.tar.xz",'--archive-sha256',$env:LEADYA_ARCHIVE_SHA256,'--commit',$env:LEADYA_SOURCE_COMMIT,'--tree',$env:LEADYA_SOURCE_TREE,'--destination',"$env:RUNNER_TEMP/unit-gate-bootstrap") -Log "$env:DEVUNIT_RESULT_ROOT/bootstrap.log"
          if($LASTEXITCODE -ne 0){throw 'Canonical checkout materialization failed'}
      - name: Acquire and check genuine heavy Windows admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @('LEADYA_MAIN_BRANCH=hotfix/0.12.3','LEADYA_WORK_ENVIRONMENT=hotfix','LEADYA_DEV_BRANCH=dev/0.12.1') | Set-Content "$env:DEVUNIT_BOOTSTRAP_ROOT/.env" -Encoding utf8
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          $gate="$env:DEVUNIT_BOOTSTRAP_ROOT/.agents/skills/leadya-project-manager/scripts/host_gate.py"
          $receipt="$env:RUNNER_TEMP/unit-admission-private.json"
          ./Invoke-PrivateUnitPython.ps1 -Script $gate -ScriptArguments @('acquire','--heavy','--key','private-unit-ci','--checkout',$env:DEVUNIT_BOOTSTRAP_ROOT,'--memory-gib','2','--disk-gib','3','--receipt-out',$receipt) -Log "$env:DEVUNIT_RESULT_ROOT/admission-acquire.log"
          if($LASTEXITCODE -ne 0){throw 'Canonical heavy admission refused'}
          $a=(Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json).admission
          ./Invoke-PrivateUnitPython.ps1 -Script $gate -ScriptArguments @('check','--key',$a.key,'--token',$a.token,'--checkout',$env:DEVUNIT_BOOTSTRAP_ROOT,'--heavy','--memory-gib','2','--disk-gib','3') -Log "$env:DEVUNIT_RESULT_ROOT/admission-check.json"
          if($LASTEXITCODE -ne 0){throw 'Canonical heavy check refused'}
      - name: Authenticate and decrypt private source
        shell: pwsh
        env:
          DEVUNIT_SOURCE_KEY: ${{ secrets.LEADYA_GROUP_V2_6A31C8E249D0_SOURCE_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          ./private_unit_crypto.ps1 -Action decrypt -InputDirectory ./encrypted-input -OutputPath "$env:RUNNER_TEMP/unit-source-private.zip" -RedTree $env:DEVUNIT_RED_TREE -GreenTree $env:DEVUNIT_GREEN_TREE -ZipSha256 $env:DEVUNIT_ZIP_SHA256
      - name: Verify full Git trees and materialize closed source subset
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./Invoke-PrivateUnitPython.ps1 -Script ./private_unit_ci.py -ScriptArguments @('materialize','--archive',"$env:RUNNER_TEMP/unit-source-private.zip",'--destination',"$env:RUNNER_TEMP/unit-private-input",'--red-tree',$env:DEVUNIT_RED_TREE,'--green-tree',$env:DEVUNIT_GREEN_TREE,'--zip-sha256',$env:DEVUNIT_ZIP_SHA256,'--provenance',"$env:DEVUNIT_RESULT_ROOT/input-provenance.json") -Log "$env:DEVUNIT_RESULT_ROOT/materialize.log"
          if($LASTEXITCODE -ne 0){throw 'Authenticated source closure refused'}
      - name: Compile and execute causal RED then verified GREEN
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:JAVA_HOME=$env:JAVA_HOME_17_X64
          if(-not(Test-Path -LiteralPath "$env:JAVA_HOME/bin/java.exe")){throw 'Image JDK17 unavailable'}
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/unit-execution-started",'started')
          ./Invoke-PrivateUnitPython.ps1 -Script ./run_private_units.py -Log "$env:DEVUNIT_RESULT_ROOT/execution.log" -Seconds 3300 -CleanupMarker "$env:RUNNER_TEMP/unit-execution-stopped"
          if($LASTEXITCODE -ne 0){throw 'Private causal unit execution failed'}
      - name: Release only own admission after verified child cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath="$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules"
          if((Test-Path -LiteralPath "$env:RUNNER_TEMP/unit-execution-started") -and -not(Test-Path -LiteralPath "$env:RUNNER_TEMP/unit-execution-stopped")){throw 'No proof that owned unit descendants stopped; retain lease'}
          $receipt="$env:RUNNER_TEMP/unit-admission-private.json"
          if(Test-Path -LiteralPath $receipt){
            ./Invoke-PrivateUnitPython.ps1 -Script "$env:DEVUNIT_BOOTSTRAP_ROOT/.agents/skills/leadya-project-manager/scripts/host_gate.py" -ScriptArguments @('release','--receipt-file',$receipt) -Log "$env:DEVUNIT_RESULT_ROOT/release.json"
            if($LASTEXITCODE -ne 0){throw 'Own admission release failed'}
          }
      - name: Encrypt private unit evidence
        if: always()
        shell: pwsh
        env:
          LEADYA_RESULT_KEY: ${{ secrets.LEADYA_GROUP_V2_6A31C8E249D0_RESULT_KEY }}
        run: |
          ./private_unit_crypto.ps1 -Action seal -InputDirectory $env:DEVUNIT_RESULT_ROOT -OutputPath "$env:RUNNER_TEMP/unit-private-sealed" -RedTree $env:DEVUNIT_RED_TREE -GreenTree $env:DEVUNIT_GREEN_TREE -ZipSha256 $env:DEVUNIT_ZIP_SHA256
      - name: Preserve ciphertext and authenticated envelope only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-unit-evidence
          path: |
            ${{ runner.temp }}/unit-private-sealed/result.cipher
            ${{ runner.temp }}/unit-private-sealed/result-envelope.json
          if-no-files-found: error
          retention-days: 7
