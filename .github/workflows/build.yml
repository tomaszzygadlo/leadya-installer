name: Private real database qualification
run-name: Authenticated private database evidence
on:
  workflow_dispatch:
    inputs:
      input_ref:
        description: Immutable public ciphertext commit
        required: true
        type: string
      red_tree:
        description: Authenticated baseline Git tree
        required: true
        type: string
      green_tree:
        description: Prospective qualified Git tree
        required: true
        type: string
      source_zip_sha256:
        description: Authenticated source ZIP SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-finance-private-db-6ed90b41c82a
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_DB_EPHEMERAL_VM: ubuntu-24.04
      DEVUNIT_BASE_COMMIT: '28d11cfb5f6bf3c1cd6ff4d3741754977935148b'
      DEVUNIT_RED_TREE: ${{ inputs.red_tree }}
      DEVUNIT_GREEN_TREE: ${{ inputs.green_tree }}
      DEVUNIT_ZIP_SHA256: ${{ inputs.source_zip_sha256 }}
      DEVUNIT_INPUT_REF: ${{ inputs.input_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate immutable input identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          assert os.environ['RUNNER_OS']=='Linux' and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          for name in ('GITHUB_SHA','DEVUNIT_BASE_COMMIT','DEVUNIT_RED_TREE','DEVUNIT_GREEN_TREE','DEVUNIT_INPUT_REF'):
              assert re.fullmatch('[a-f0-9]{40}',os.environ[name])
          assert re.fullmatch('[a-f0-9]{64}',os.environ['DEVUNIT_ZIP_SHA256'])
          print('Immutable identities accepted; private tests have not run.')
          PY
      - name: Check generic worker guards without application data or services
        shell: bash
        run: python3 -m unittest -v test_private_db_units.py test_private_linux_admission.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ inputs.input_ref }}'
          path: encrypted-input
          persist-credentials: false
          sparse-checkout: |
            source.cipher
            source-envelope.json
            bootstrap.cipher
            bootstrap-envelope.json
          sparse-checkout-cone-mode: false
      - name: Authenticate source and original resource policy
        shell: bash
        env:
          DEVUNIT_BOOTSTRAP_KEY: ${{ secrets.LEADYA_FINANCE_DB_6ED90B41C82A_BOOTSTRAP_KEY }}
          DEVUNIT_SOURCE_KEY: ${{ secrets.LEADYA_FINANCE_DB_6ED90B41C82A_SOURCE_KEY }}
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,CI_DB_EPHEMERAL_VM,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_ENV,RUNNER_TEMP,DEVUNIT_RED_TREE,DEVUNIT_GREEN_TREE,DEVUNIT_ZIP_SHA256,DEVUNIT_INPUT_REF,DEVUNIT_BASE_COMMIT,DEVUNIT_BOOTSTRAP_KEY,DEVUNIT_SOURCE_KEY python3 ./run_private_db_units.py prepare --input-directory "$PWD/encrypted-input" --checkout "$PWD"
      - name: Admit bounded Maven and database workload on this dedicated VM
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,CI_DB_EPHEMERAL_VM,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP,DEVUNIT_RED_TREE,DEVUNIT_GREEN_TREE,DEVUNIT_ZIP_SHA256,DEVUNIT_INPUT_REF,DEVUNIT_BASE_COMMIT,JAVA_HOME_17_X64 python3 "$DBJOB_ROOT/run_private_db_units.py" execute --job-root "$DBJOB_ROOT"
      - name: Verify exact owned workload closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${DBJOB_ROOT:-}"; then echo 'No workload workspace was initialized.'; exit 0; fi
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,CI_DB_EPHEMERAL_VM,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP,DEVUNIT_RED_TREE,DEVUNIT_GREEN_TREE,DEVUNIT_ZIP_SHA256,DEVUNIT_INPUT_REF,DEVUNIT_BASE_COMMIT python3 "$DBJOB_ROOT/run_private_db_units.py" recover --job-root "$DBJOB_ROOT"
      - name: Encrypt private results and full fixture custody evidence
        if: always()
        shell: bash
        env:
          LEADYA_RESULT_KEY: ${{ secrets.LEADYA_FINANCE_DB_6ED90B41C82A_RESULT_KEY }}
        run: |
          set -euo pipefail
          test -n "${DBJOB_ROOT:-}"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,CI_DB_EPHEMERAL_VM,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP,DEVUNIT_RED_TREE,DEVUNIT_GREEN_TREE,DEVUNIT_ZIP_SHA256,DEVUNIT_INPUT_REF,DEVUNIT_BASE_COMMIT,LEADYA_RESULT_KEY python3 "$DBJOB_ROOT/run_private_db_units.py" seal --job-root "$DBJOB_ROOT"
      - name: Preserve ciphertext and authenticated envelope only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-unit-evidence
          path: |
            ${{ runner.temp }}/db-private-sealed/result.cipher
            ${{ runner.temp }}/db-private-sealed/result-envelope.json
          if-no-files-found: error
          retention-days: 7
